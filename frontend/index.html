<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab by João</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 { text-align: center; color: #333; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .msg { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>CodeLab by João</h2>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="senha" placeholder="Sua senha">
        <button onclick="cadastrar()">Cadastrar</button>
        <div class="msg" id="msg"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function cadastrar() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msgDiv = document.getElementById('msg');

            msgDiv.style.color = '#333';
            msgDiv.innerText = 'Cadastrando...';

            try {
                const resposta = await fetch(`${API_URL}/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro || 'Erro ao cadastrar');
                }

                msgDiv.style.color = 'green';
                msgDiv.innerText = 'Cadastro realizado com sucesso! 🎉';
            } catch (err) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = 'Erro: ' + err.message;
            }
        }
    </script>
</body>
</html>
